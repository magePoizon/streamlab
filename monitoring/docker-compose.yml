services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    # LAN access
    ports:
      - "9090:9090"
    # Public URL for correct links behind Cloudflare Access
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://prometheus.ratbzn.com"
    networks:
      - containers_network
    volumes:
      - /opt/streamlab/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/streamlab/data/prometheus:/prometheus
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # LAN access
    ports:
      - "3000:3000"
    networks:
      - containers_network
    volumes:
      - /opt/streamlab/data/grafana:/var/lib/grafana
      - /opt/streamlab/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/streamlab/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    env_file:
      - /opt/streamlab/secrets/monitor.env
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - containers_network
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - containers_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  containers_network:
    external: true
